<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bilim Type — Жаңа логика</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background:#f4f6f9; color:#1f2937; }
    .container { max-width: 1100px; margin: 20px auto; background:#fff; border-radius:16px; padding:24px; box-shadow:0 10px 30px rgba(0,0,0,.08); }
    .hidden { display:none !important; }
    h1,h2,h3,p { margin: 0 0 12px; }
    .row { display:flex; gap:16px; }
    .col { flex:1; }
    label { display:block; font-weight:600; margin-bottom:6px; }
    select,input,button { width:100%; box-sizing:border-box; border-radius:10px; border:1px solid #d1d5db; padding:12px; font-size:16px; }
    button { cursor:pointer; border:none; }
    .primary { background:#2563eb; color:#fff; font-weight:700; }
    .primary:disabled { background:#93c5fd; cursor:not-allowed; }
    .secondary { background:#6b7280; color:#fff; font-weight:700; }
    .danger { background:#dc2626; color:#fff; font-weight:700; }
    .small-finish { max-width: 220px; margin-left:auto; font-size:14px; padding:10px 12px; }
    .badge { background:#eff6ff; border:1px solid #bfdbfe; color:#1d4ed8; border-radius:999px; padding:6px 10px; font-size:14px; display:inline-block; }

    .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .stats { display:flex; gap:16px; font-weight:700; }
    .track { position:relative; height:100px; border-radius:10px; overflow:hidden; background:linear-gradient(to bottom,#dbeafe,#fff); border-bottom:4px solid #92400e; margin-bottom:14px; }
    .horse { position:absolute; left:0; bottom:0; height:70px; transition:left .2s ease; }
    .finish-line { position:absolute; right:16px; top:0; bottom:0; border-left:4px dashed #ef4444; }
    #text-display { font-family: monospace; font-size:24px; line-height:1.6; min-height:140px; border:2px solid #2563eb; border-radius:10px; padding:16px; white-space:pre-wrap; }
    .cursor { border-left:2px solid #2563eb; animation:blink 1s infinite; }
    .correct { color:#15803d; }
    .incorrect { color:#b91c1c; background:#fee2e2; }
    @keyframes blink { 50% { border-color: transparent; } }
    #input-field { position:fixed; top:-100px; opacity:0; }
    .muted { color:#6b7280; font-size:14px; }
    .mode-tabs { display:flex; gap:8px; margin-bottom:14px; }
    .mode-tabs button.active { background:#1d4ed8; color:white; }
    .result-card { background:#ecfeff; border:1px solid #99f6e4; border-radius:10px; padding:14px; margin-top:12px; }
  </style>
</head>
<body>
  <div class="container">
    <div id="login-section">
      <h1>Bilim Type</h1>
      <p class="muted">Оқушыны тізімнен таңдау, сынып/тілге сай мәтін сүзгілеу, рөлдік кіру.</p>

      <div class="mode-tabs">
        <button class="active" id="btn-typing" onclick="selectMode('typing')">⌨️ Теру</button>
        <button id="btn-reading" onclick="selectMode('reading')">🎤 Оқу</button>
      </div>

      <div class="row">
        <div class="col">
          <label>Рөл</label>
          <select id="role-select">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="parent">Parent</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="col">
          <label>Сынып</label>
          <select id="class-select"></select>
        </div>
        <div class="col">
          <label>Оқыту тілі (авто)</label>
          <input id="language-input" readonly />
        </div>
      </div>

      <div class="row" style="margin-top:12px;">
        <div class="col">
          <label>Оқушы (тек тізімнен)</label>
          <select id="student-select"></select>
        </div>
        <div class="col">
          <label>Мәтін</label>
          <select id="text-select"></select>
        </div>
      </div>

      <p id="parent-note" class="muted hidden" style="margin-top:10px;">Parent рөлі: тек өз балаңыздың статистикасын көресіз (Firebase rules арқылы).</p>

      <div class="row" style="margin-top:14px;">
        <div class="col"><button class="primary" id="start-btn" onclick="startApp()">Бастау 🚀</button></div>
        <div class="col"><a href="progress.html" target="_blank"><button class="secondary" type="button">Live Progress беті</button></a></div>
      </div>
    </div>

    <div id="typing-mode" class="hidden">
      <div class="top">
        <button class="secondary" id="exit-btn" onclick="goHome()">⬅ Шығу</button>
        <div class="stats">
          <span>⏱️ <span id="typing-timer">00:00</span></span>
          <span>❌ <span id="error-count">0</span></span>
          <span>📈 <span id="progress-text">0%</span></span>
        </div>
      </div>
      <div class="track">
        <img src="horse.gif" class="horse" id="horse-img" alt="horse" />
        <div class="finish-line"></div>
      </div>
      <div id="text-display" onclick="focusInput()"></div>
      <input id="input-field" type="text" autocomplete="off" />
      <button class="danger small-finish" onclick="requestFinish()">Жұмысты аяқтау 🏁</button>
      <p class="muted" style="margin-top:8px;">Теру басталғаннан кейін шығу/жабу батырмалары блокталады. Аяқтау батырмасы арқылы ғана шығасыз.</p>
    </div>

    <div id="reading-mode" class="hidden">
      <div class="top">
        <button class="secondary" onclick="goHome()">⬅ Шығу</button>
        <span class="badge">Оқу режимі</span>
      </div>
      <div id="reading-text"></div>
    </div>

    <div id="result" class="result-card hidden"></div>
  </div>

<script>
const GOOGLE_SCRIPT_URL = 'KEY';

const classLanguageMap = {
  '3A':'Қазақша',
  '3M':'Орысша',
  '2A':'Қазақша',
  '2M':'Орысша',
  '4A':'Қазақша',
  '4M':'Орысша'
};

const defaultStudents = [
  { id:'S001', name:'Аян Сәрсен', classId:'3A', parentId:'P001' },
  { id:'S002', name:'Мадина Асқар', classId:'3A', parentId:'P002' },
  { id:'S003', name:'Илья Смирнов', classId:'3M', parentId:'P003' },
  { id:'S004', name:'Камила Нұрлан', classId:'4A', parentId:'P004' }
];

let remoteTexts = [];
let currentMode = 'typing';
let isTyping = false;
let lockExit = false;
let textContent = '';
let selectedTitle = '';
let currentIndex = 0;
let errors = 0;
let seconds = 0;
let timerInterval;

function selectMode(mode){
  currentMode = mode;
  document.getElementById('btn-typing').classList.toggle('active', mode==='typing');
  document.getElementById('btn-reading').classList.toggle('active', mode==='reading');
}

function fillClasses(){
  const classes = [...new Set(defaultStudents.map(s=>s.classId))].sort();
  const classSel = document.getElementById('class-select');
  classSel.innerHTML = classes.map(c=>`<option value="${c}">${c}</option>`).join('');
}

function updateLanguage(){
  const classId = document.getElementById('class-select').value;
  document.getElementById('language-input').value = classLanguageMap[classId] || 'Белгісіз';
}

function filterStudents(){
  const classId = document.getElementById('class-select').value;
  const studentSel = document.getElementById('student-select');
  const students = defaultStudents.filter(s => s.classId === classId);
  studentSel.innerHTML = students.map(s=>`<option value="${s.id}">${s.name} (${s.id})</option>`).join('');
}

function normalizeText(t){
  return {
    title: t.title || t.name || 'Атаусыз мәтін',
    content: t.content || t.text || '',
    grade: String(t.grade || t.classNum || '').replace(/[^0-9]/g,''),
    language: (t.language || t.lang || '').toLowerCase()
  };
}

function mapLang(lang){
  const value = (lang || '').toLowerCase();
  if (value.includes('ор') || value.includes('ru')) return 'орысша';
  return 'қазақша';
}

function filterTexts(){
  const classId = document.getElementById('class-select').value;
  const grade = classId.replace(/[^0-9]/g,'');
  const lang = mapLang(document.getElementById('language-input').value);
  const list = remoteTexts.filter(t => String(t.grade) === grade && mapLang(t.language) === lang);
  const sel = document.getElementById('text-select');
  if(!list.length){
    sel.innerHTML = '<option value="">Сәйкес мәтін табылмады</option>';
    document.getElementById('start-btn').disabled = true;
    return;
  }
  sel.innerHTML = list.map(t=>`<option value="${encodeURIComponent(t.content)}">${t.title}</option>`).join('');
  document.getElementById('start-btn').disabled = false;
}

function bindFilters(){
  const classSel = document.getElementById('class-select');
  classSel.addEventListener('change', () => { updateLanguage(); filterStudents(); filterTexts(); });
  document.getElementById('role-select').addEventListener('change', (e)=>{
    document.getElementById('parent-note').classList.toggle('hidden', e.target.value !== 'parent');
  });
}

async function loadTexts(){
  try {
    const resp = await fetch(GOOGLE_SCRIPT_URL);
    const data = await resp.json();
    remoteTexts = data.map(normalizeText);
  } catch {
    remoteTexts = [
      { title:'3-сынып қазақша үлгі', content:'Бұл 3 сыныпқа арналған қазақша мәтін.', grade:'3', language:'қазақша' },
      { title:'3 класс русский', content:'Это русский текст для 3 класса.', grade:'3', language:'орысша' },
      { title:'4-сынып қазақша', content:'Төртінші сынып мәтіні.', grade:'4', language:'қазақша' }
    ];
  }
  filterTexts();
}

function startApp(){
  const studentId = document.getElementById('student-select').value;
  if(!studentId) return alert('Оқушыны тізімнен таңдаңыз.');
  const sel = document.getElementById('text-select');
  if(!sel.value) return alert('Мәтін таңдаңыз.');

  textContent = decodeURIComponent(sel.value);
  selectedTitle = sel.options[sel.selectedIndex].text;
  document.getElementById('login-section').classList.add('hidden');

  if(currentMode === 'typing') startTypingMode();
  else startReadingMode();
}

function startTypingMode(){
  document.getElementById('typing-mode').classList.remove('hidden');
  document.getElementById('result').classList.add('hidden');

  currentIndex = 0; errors = 0; seconds = 0;
  document.getElementById('error-count').innerText = '0';
  document.getElementById('typing-timer').innerText = '00:00';
  document.getElementById('progress-text').innerText = '0%';
  document.getElementById('horse-img').style.left = '0%';

  renderText();
  isTyping = true;
  lockExit = true;
  focusInput();

  timerInterval = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds/60)).padStart(2,'0');
    const s = String(seconds%60).padStart(2,'0');
    document.getElementById('typing-timer').innerText = `${m}:${s}`;
  },1000);
}

function renderText(){
  const box = document.getElementById('text-display');
  box.innerHTML = '';
  textContent.split('').forEach((ch, i) => {
    const sp = document.createElement('span');
    sp.innerText = ch;
    if(i===0) sp.classList.add('cursor');
    box.appendChild(sp);
  });
}

function focusInput(){ document.getElementById('input-field').focus(); }

function updateProgress(){
  const total = Math.max(textContent.length,1);
  const percent = Math.floor((currentIndex/total)*100);
  document.getElementById('progress-text').innerText = `${percent}%`;
  document.getElementById('horse-img').style.left = `${Math.min(percent,92)}%`;
}

document.getElementById('input-field').addEventListener('input', (e) => {
  if(!isTyping) return;
  const val = e.data; e.target.value = '';
  if(!val) return;

  const spans = document.getElementById('text-display').children;
  if(currentIndex >= spans.length) return;

  const target = textContent[currentIndex];
  if(val === target) spans[currentIndex].className = 'correct';
  else { spans[currentIndex].className = 'incorrect'; errors++; document.getElementById('error-count').innerText = errors; }

  spans[currentIndex].classList.remove('cursor');
  currentIndex++;
  updateProgress();

  if(currentIndex < spans.length) spans[currentIndex].classList.add('cursor');
  else requestFinish(true);
});

function requestFinish(auto=false){
  if(!isTyping) return;
  if(!auto){
    const ok = window.confirm('Жұмысты аяқтауға сенімдісіз бе?');
    if(!ok) return;
  }
  finishTyping();
}

function finishTyping(){
  if(!isTyping) return;
  isTyping = false;
  lockExit = false;
  clearInterval(timerInterval);

  const total = Math.max(textContent.length,1);
  const progress = Math.floor((currentIndex/total)*100);
  const accuracy = currentIndex ? Math.max(0, Math.floor(((currentIndex-errors)/currentIndex)*100)) : 0;
  const score = Math.max(1, Math.round((progress/100)*(accuracy/100)*10));

  document.getElementById('result').classList.remove('hidden');
  document.getElementById('result').innerHTML = `
    <h3>Нәтиже</h3>
    <p>Мәтін: <b>${selectedTitle}</b></p>
    <p>Прогресс: <b>${progress}%</b> | Дәлдік: <b>${accuracy}%</b> | Балл: <b>${score}</b></p>
    <p>Уақыт: <b>${document.getElementById('typing-timer').innerText}</b></p>
  `;

  sendData({ progress, accuracy, score });
}

function goHome(){
  if(lockExit){
    alert('Теру жүріп жатыр. Алдымен "Жұмысты аяқтау" батырмасын басыңыз.');
    return;
  }
  clearInterval(timerInterval);
  isTyping = false;
  document.getElementById('typing-mode').classList.add('hidden');
  document.getElementById('reading-mode').classList.add('hidden');
  document.getElementById('login-section').classList.remove('hidden');
}

window.addEventListener('beforeunload', (e) => {
  if(lockExit){
    e.preventDefault();
    e.returnValue = '';
  }
});

function startReadingMode(){
  document.getElementById('reading-mode').classList.remove('hidden');
  document.getElementById('reading-text').innerText = textContent;
}

function sendData(metrics){
  const classId = document.getElementById('class-select').value;
  const studentId = document.getElementById('student-select').value;
  const studentName = document.getElementById('student-select').selectedOptions[0]?.text || '';
  const payload = {
    studentId,
    studentName,
    classId,
    language: document.getElementById('language-input').value,
    textTitle: selectedTitle,
    time: document.getElementById('typing-timer').innerText,
    progress: metrics.progress,
    accuracy: metrics.accuracy,
    score: metrics.score,
    role: document.getElementById('role-select').value,
    timestamp: new Date().toISOString()
  };

  fetch(GOOGLE_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).catch(() => {});
}

(function init(){
  fillClasses();
  bindFilters();
  updateLanguage();
  filterStudents();
  loadTexts();
})();
</script>
</body>
</html>
